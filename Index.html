        }
        .batch-btn:hover {

        }
        .batch-btn.completed {

        function loadAppData() {

            const savedComp = localStorage.getItem('ru_completed');
            if (savedProg) userProgress = JSON.parse(savedProg);
            if (savedComp) completedBatches = JSON.parse(savedComp);
        }

        function saveAppData() {
            localStorage.setItem('ru_progress', JSON.stringify(userProgress));
            localStorage.setItem('ru_completed', JSON.stringify(completedBatches));
        }

            6: 100, 7: 250, 8: 500, 9: 750, 10: 1000
        };

        let activeBatchIndex = null;
        let isPracticeMode = false;

        function initMenu() {
            loadAppData();
            const grid = document.getElementById("batch-menu-grid");
            grid.innerHTML = "";

            for (let i = 0; i < allWordsData.length; i++) {
                const btn = document.createElement("button");
                btn.className = "batch-btn";
                let batchNum = i + 1;
                btn.innerText = `Batch ${batchNum}`;
                
                if (completedBatches[i]) {
                    btn.classList.add("completed");
                    btn.innerText += " ✓";
                }

                btn.onclick = () => startBatchStudy(i);
                grid.appendChild(btn);
            }
        }

        function returnToMenu() {
            document.getElementById("screen-study").classList.remove("active");
            document.getElementById("screen-menu").classList.add("active");
            initMenu();
        }

            currentActiveQueue = JSON.parse(JSON.stringify(allWordsData[batchIndex]));
            currentActiveQueue.forEach(w => {
                if (!userProgress[w.id]) {
                    userProgress[w.id] = { state: 1, correctInState: 0 };
                }
            });

            document.getElementById("screen-menu").classList.remove("active");
            document.getElementById("screen-study").classList.add("active");
            loadCard();
        }

        function startPracticeMode() {
            isPracticeMode = true;
            document.getElementById("study-title").innerText = `⚡ Multi-Batch Practice`;
            
            currentActiveQueue = [];
            for (let bId in completedBatches) {
                if (completedBatches[bId]) {
                    currentActiveQueue.push(...allWordsData[bId]);
                }
            }

            if (currentActiveQueue.length === 0) {
                alert("You haven't completed any batches yet! Finish at least one batch to unlock Practice Mode.");
                return;
            }

            currentActiveQueue.sort(() => Math.random() - 0.5);

            document.getElementById("screen-menu").classList.remove("active");
            document.getElementById("screen-study").classList.add("active");
            loadCard();
        }

        let currentWord = null;

        function loadCard() {
            if (currentActiveQueue.length === 0) {
                if (!isPracticeMode) {
                    completedBatches[activeBatchIndex] = true;
                    saveAppData();
                }
                document.getElementById("word-display").innerText = "🎉";
                document.getElementById("card-back").style.display = "block";
                document.getElementById("phonetic-display").innerText = "Batch Complete!";
                document.getElementById("translation-display").innerText = "Great job working through this set.";
                document.getElementById("info-display").innerText = "Returning to menu...";
                document.getElementById("btn-show").style.display = "none";
                document.getElementById("btn-fail").style.display = "none";
                document.getElementById("btn-pass").style.display = "none";
                
                setTimeout(returnToMenu, 2500);
                return;
            }

            currentWord = currentActiveQueue[0];
            let prog = userProgress[currentWord.id] || { state: 1, correctInState: 0 };

            document.getElementById("word-display").innerText = currentWord.cyrillic;
            document.getElementById("phonetic-display").innerText = currentWord.phonetic;
            document.getElementById("translation-display").innerText = currentWord.translation;
            document.getElementById("info-display").innerText = currentWord.info;
            
            document.getElementById("stat-queue").innerText = `Queue: ${currentActiveQueue.length}`;
            document.getElementById("stat-state").innerText = `State: ${prog.state}`;
            document.getElementById("stat-progress").innerText = isPracticeMode ? `Mode: Practice` : `Progress: ${10 - currentActiveQueue.length + 1}/10`;

            document.getElementById("card-back").style.display = "none";
            document.getElementById("btn-show").style.display = "block";
            document.getElementById("btn-fail").style.display = "none";
            document.getElementById("btn-pass").style.display = "none";
        }

        function showAnswer() {
            document.getElementById("card-back").style.display = "block";
            document.getElementById("btn-show").style.display = "none";
            document.getElementById("btn-fail").style.display = "block";
            document.getElementById("btn-pass").style.display = "block";
        }

        function handleResponse(passed) {
            let prog = userProgress[currentWord.id];
            let item = currentActiveQueue.shift();

            if (passed) {
                prog.correctInState++;
                let required = stateThresholds[prog.state] || 1000;
                
                if (prog.correctInState >= required && prog.state < 10) {
                    prog.state++;
                    prog.correctInState = 0;
                }

                let pushBackIndex = Math.min(prog.state * 2, currentActiveQueue.length);
                currentActiveQueue.splice(pushBackIndex, 0, item);

            } else {
                let penalty = prog.state;
                prog.correctInState = Math.max(0, prog.correctInState - penalty);
                
                if (prog.correctInState === 0 && prog.state > 1) {
                    prog.state--;
                }

                let retestPos = Math.min(2, currentActiveQueue.length);
                currentActiveQueue.splice(retestPos, 0, item);
            }

            saveAppData();
            loadCard();
        }

        function speakCurrentWord() {
            if (!currentWord) return;
            if ('speechSynthesis' in window) {
                const utterance = new SpeechSynthesisUtterance(currentWord.cyrillic);
                utterance.lang = 'ru-RU';
                utterance.rate = 0.9;
                window.speechSynthesis.speak(utterance);
            }
        }

        initMenu();
    </script>
</body>
</html>
